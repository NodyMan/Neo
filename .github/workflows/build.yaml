name: Build Neo APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Neo zip
        run: |
          best=""; bestv="0"
          for z in *.zip; do
            [ -f "$z" ] || continue
            v=$(unzip -p "$z" neo_app/pubspec.yaml 2>/dev/null | sed -n 's/^version: *//p' | head -1)
            echo "Found: $z -> version ${v:-none}"
            [ -z "$v" ] && continue
            top=$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)
            if [ "$top" = "$v" ] && [ "$v" != "$bestv" ]; then best="$z"; bestv="$v"; fi
          done
          if [ -z "$best" ]; then echo "No Neo zip found in the repo"; exit 1; fi
          echo "Using $best (Neo version $bestv)"
          rm -rf neo_app
          unzip -o -q "$best"
          echo "NEO_VERSION=$bestv" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: neo_app
        run: |
          bash tool/prepare_android.sh
          flutter pub get
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neo ${{ env.NEO_VERSION }} (build ${{ github.run_number }})
          files: neo_app/build/app/outputs/flutter-apk/app-release.apk
