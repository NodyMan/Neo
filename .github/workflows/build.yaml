name: Build Neo APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app code
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "No zip file found in the repo"; exit 1; fi
          echo "Using $Z"
          unzip -o -q "$Z"
          if [ ! -f neo_app/lib/neo/neo_face.dart ]; then echo "This zip is the OLD Neo app. Upload the new one."; exit 1; fi
      - name: Fix record plugin version
        run: |
          sed -i 's/^  record: .*/  record: ^6.0.0/' neo_app/pubspec.yaml
          grep "record:" neo_app/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: neo_app
        run: |
          bash tool/prepare_android.sh
          flutter pub get
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neo app build ${{ github.run_number }}
          files: neo_app/build/app/outputs/flutter-apk/app-release.apk
